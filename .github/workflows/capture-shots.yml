name: Capture screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC

permissions:
  contents: write

concurrency:
  group: capture-shots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/capture_shots.py --out shots
      - name: Commit new screenshots
        run: |
          git config user.name "gameboard-bot"
          git config user.email "gameboard-bot@users.noreply.github.com"
          git add shots
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update screenshots"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
