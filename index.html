aside{overflow-y:auto}
aside nav{gap:3px}
aside nav button{height:38px}
aside nav button .cnt{margin-left:auto;font-size:10px;color:#93a08b;font-weight:500}
aside nav button.selected .cnt{color:#4d6a52}
aside nav button svg{flex-shrink:0}
.navlabel.sp{margin-top:20px}
.sidebottom{padding-top:18px}
.sidebottom .bk{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.sidebottom .bk button{border:1px solid #d9e0d0;border-radius:6px;padding:7px 9px;font-size:10px;display:inline-flex;gap:6px;align-items:center;background:#f7f9f3}
.sidebottom .bk button:hover{background:#e6ecdd}
.sidebottom .linkish{text-decoration:underline;font-size:10px;color:#7a8a72}
.stats{grid-template-columns:repeat(4,1fr)}
.stats>button.static{cursor:default}
.ghnote{font-size:11px;color:#8a967e;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.ghnote.warn{color:#8c6431}
.secthead{display:flex;align-items:baseline;gap:12px;margin:38px 0 4px}
.secthead h2{margin:0;font-size:19px;letter-spacing:-.5px}
.secthead .n{font-size:11px;color:#929b89}
.secthead a{margin-left:auto;font-size:11px;color:#6d8561;text-decoration:none}
.secthead a:hover{text-decoration:underline}
.blurb{font-size:12px;color:#869080;margin:0 0 4px}
.card{padding:0;display:flex;flex-direction:column;overflow:hidden}
.card:hover{transform:translateY(-3px)}
.cardmain{display:block;width:100%;text-align:left;padding:22px 22px 6px}
.cardmain:focus-visible{outline-offset:-3px;border-radius:11px}
.card h3{margin:18px 0 6px}
.desc{font-size:11px;line-height:1.65;color:#6f7f66;margin:12px 0 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.cardlinks{display:flex;gap:6px;flex-wrap:wrap;padding:8px 22px 0}
.cardlinks a{font-size:10px;border:1px solid #e3e8dc;border-radius:5px;padding:6px 9px;text-decoration:none;color:#5d7352;display:inline-flex;gap:5px;align-items:center;background:#fafbf7;min-height:30px}
.cardlinks a:hover{background:#eef2e7;border-color:#c5d3b8}
.cardmeta{padding:14px 22px 20px;margin-top:auto}
.cardmeta .carddivider{margin:6px 0 14px}
.cardfoot{flex-wrap:wrap}
.badge.review{background:#fcf0d9;color:#8c6431;border:1px dashed #e2c690}
.badge.new{background:#e4eefb;color:#3f6590}
.badge.paused{background:#eceee9;color:#7b8576}
.cardtop .badges{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.cardtop .badge{margin-left:0}
.catchip{font-size:9px;color:#8a9a7e;letter-spacing:.3px}
.filters button{min-height:34px}
.filters{flex-wrap:wrap}
.editbody select[multiple]{min-height:auto}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.editfoot .danger.txt{font-size:11px;padding:0 10px;width:auto;gap:6px}
.flagrow{display:flex;gap:9px;align-items:center;font-size:12px;margin:0 0 18px;color:#6a7a5f}
.flagrow input{width:auto!important;min-height:0!important;margin:0!important}
.ghinfo{background:#f1f4ec;border:1px solid #e1e7d8;border-radius:8px;padding:12px 14px;font-size:11px;line-height:1.7;color:#6b7a62;margin-bottom:20px}
.ghinfo b{color:#41583a}
.hv{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1190px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
 aside{overflow:visible}
 .navs{display:flex;overflow:auto;gap:6px;margin:20px -7px 0;padding-bottom:9px}
 .navs .navlabel{display:none}
 aside .navs nav{display:contents;margin:0;padding:0;overflow:visible}
 aside nav button .cnt{margin-left:4px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .cardmain{padding:21px 21px 6px}
 .cardlinks{padding:8px 21px 0}
 .cardmeta{padding:14px 21px 20px}
}

/* ====================================================================

   - Repo list + status come live from the public GitHub API (cached 1 hour).
   - Your edits (status, bugs, QA, notes...) are saved in this browser's
     localStorage. Use Backup > Export / Import to move them between devices.
   ==================================================================== */
const OWNER='OuterHeavenX';
const KEY='gameboard.v2', GHKEY='gameboard.gh.v1';
const GH_TTL=60*60*1000;

/* ---------- Categories ---------- */

const catName=id=>(CATS.find(c=>c.id===id)||{name:'Unsorted'}).name;

/* ---------- Seed manifest: [repo, display name, category, engine, guessed?] ----------

 ['GameBoard','Gameboard (this app)','tools','Static web app'],

const STAGES=['Active','Paused','Blocked','Ready to release'];
const TARGETS=['Browser','iPhone','Steam Deck','Windows','Linux'];
const QA_KIND_TARGET={'Browser QA':'Browser','Real iPhone':'iPhone','Real Steam Deck':'Steam Deck'};
const qaDefaults=()=>[
 {label:'Build and automated tests',kind:'Automated',status:'Not tested',date:'',device:'CI / local runner',notes:''},
 {label:'Browser gameplay and save / reload',kind:'Browser QA',status:'Not tested',date:'',device:'',notes:''},
 {label:'Touch controls, scrolling and safe areas',kind:'Real iPhone',status:'Not tested',date:'',device:'',notes:''},
 {label:'Controller, 1280×800 and save / resume',kind:'Real Steam Deck',status:'Not tested',date:'',device:'',notes:''}];
const defaults=()=>({name:'',cat:'lab',engine:'',version:'',status:'',repo:'',live:'',itch:'',build:'',targets:['Browser'],bugs:'',done:'',pending:'',priorities:['','',''],blocker:'',qa:qaDefaults(),logs:[],confirmed:false});
const FIELDS=['name','cat','engine','version','status','repo','live','itch','build','targets','bugs','done','pending','priorities','blocker','qa','logs','confirmed'];

/* ---------- theme ---------- */
const isDark=()=>document.documentElement.dataset.theme==='dark';
function applyTheme(t){
 document.documentElement.dataset.theme=t;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#121714':'#f7f8f5';
}
function toggleTheme(){
 const t=isDark()?'light':'dark';applyTheme(t);
 try{localStorage.setItem('gameboard.theme',t)}catch(e){}
 render();
}
try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{
 let saved=null;try{saved=localStorage.getItem('gameboard.theme')}catch(x){}
 if(!saved){applyTheme(e.matches?'dark':'light');render()}
})}catch(e){}
applyTheme(isDark()?'dark':'light');

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const lines=v=>String(v||'').split('\n').filter(x=>x.trim());
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const today=()=>new Date().toISOString().slice(0,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function ago(iso){if(!iso)return '';const d=(Date.now()-new Date(iso))/864e5;if(d<1){const h=Math.floor(d*24);return h<1?'just now':h+'h ago'}if(d<30)return Math.floor(d)+'d ago';if(d<365)return Math.floor(d/30)+'mo ago';return Math.floor(d/365)+'y ago'}
function pretty(n){return n.replace(/[-_]+$/,'').replace(/[-_]+/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,c=>c.toUpperCase())}

const ICONS={
 dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
 layers:'<path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/>',
 alert:'<path d="M12 8v5"/><path d="M12 16h.01"/><path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/>',
 rocket:'<path d="M12 3c4 1 7 4 7 9l-4 4H9l-4-4c0-5 3-8 7-9z"/><circle cx="12" cy="10" r="1.6"/><path d="M9 16l-2 5 5-2M15 16l2 5-5-2"/>',
 git:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7"/><path d="M18 15.5V9a3 3 0 0 0-3-3h-3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 up:'<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 check:'<path d="m5 12 5 5 9-10"/>',
 pad:'<rect x="2" y="6" width="20" height="12" rx="5"/><path d="M6 12h4M8 10v4"/><circle cx="15" cy="12" r=".8"/><circle cx="18" cy="11" r=".8"/>',
 ext:'<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
 trash:'<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
 down:'<path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/>',
 upl:'<path d="M12 16V5"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/>',
 flask:'<path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/>',
 phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
 arrow:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
 folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
 play:'<path d="m7 4 13 8-13 8z"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 gh:'<path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.800-.3 5.500-1.400 5.500-6a4.600 4.600 0 0 0-1.300-3.200 4.200 4.200 0 0 0-.1-3.200s-1.100-.3-3.500 1.300a12 12 0 0 0-6.200 0C6.500 2.800 5.400 3.100 5.400 3.100a4.200 4.200 0 0 0-.1 3.200A4.600 4.600 0 0 0 4 9.500c0 4.600 2.700 5.700 5.500 6-.6.600-.6 1.200-.5 2V21"/>'
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- storage ---------- */
function loadStore(){
 try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')return{over:s.over||{},custom:s.custom||[],hidden:s.hidden||[]}}catch(e){}
 return{over:{},custom:[],hidden:[]};
}
let store=loadStore();
function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(store));return true}
 catch(e){toast('Could not save in this browser (storage is blocked or full). Use Backup › Export so you do not lose edits.',true);return false}
}
let gh={repos:[],t:0,err:'',loading:false};
function loadGhCache(){try{const c=JSON.parse(localStorage.getItem(GHKEY)||'null');if(c&&Array.isArray(c.repos)){gh.repos=c.repos;gh.t=c.t||0}}catch(e){}}
async function fetchGh(force){
 if(!force&&gh.repos.length&&Date.now()-gh.t<GH_TTL)return;
 gh.loading=true;gh.err='';render();
 try{
  let all=[];
  for(let page=1;page<=5;page++){
   const r=await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=pushed&page=${page}`,{headers:{Accept:'application/vnd.github+json'}});
   if(!r.ok){throw new Error(r.status===403||r.status===429?'GitHub rate limit reached — try again in a bit.':'GitHub returned '+r.status+'.')}
   const batch=await r.json();
   all=all.concat(batch.map(x=>({name:x.name,html_url:x.html_url,description:x.description||'',language:x.language||'',topics:x.topics||[],pushed_at:x.pushed_at,stars:x.stargazers_count,has_pages:!!x.has_pages,homepage:x.homepage||'',archived:!!x.archived,fork:!!x.fork})));
   if(batch.length<100)break;
  }
  gh.repos=all;gh.t=Date.now();
  try{localStorage.setItem(GHKEY,JSON.stringify({t:gh.t,repos:all}))}catch(e){}
 }catch(e){
  gh.err=(e&&e.message&&!/Failed to fetch|NetworkError|Load failed/i.test(e.message))?e.message:'Could not reach GitHub.';
  if(gh.repos.length)gh.err+=' Showing the last saved copy'+(gh.t?' ('+ago(new Date(gh.t).toISOString())+')':'')+'.';
 }finally{gh.loading=false;render()}
}

/* ---------- project model ---------- */
function suggest(r){
 const t=(r.name+' '+r.description+' '+(r.topics||[]).join(' ')).toLowerCase();
 const rules=[
  ['tools',/\b(tool|app|dashboard|tracker|vault|manager|pipeline|bible|planner|board)\b/],
  ['defense',/tower|defen[cs]e|\brts\b|siege|strategy|warden|garrison/],
  ['rpg',/\brpg\b|jrpg|tactic|dungeon|quest/],
  ['builders',/city|village|kingdom|town|settle|builder|colony|idle|tycoon|castle/],
  ['cozy',/farm|cozy|life sim|garden|craft|island/],
  ['horror',/horror|surviv|zombie|ghost|dead|haunt|dark/],
  ['action',/platform|metroidvania|brawl|beat|shooter|action|stealth|fight|racing|roguelike/]];
 for(const[id,re]of rules)if(re.test(t))return id;
 return 'lab';
}
function bases(){
 const ghMap=new Map(gh.repos.map(r=>[r.name.toLowerCase(),r]));
 const seen=new Set(),out=[];
 for(const[repo,name,cat,engine,guess]of M){
  const id=repo.toLowerCase();seen.add(id);
  out.push({base:{id,name,cat,engine,guess:!!guess,repo:`https://github.com/${OWNER}/${repo}`,repoName:repo},g:ghMap.get(id)||null});
 }
 for(const r of gh.repos){
  const id=r.name.toLowerCase();if(seen.has(id))continue;
  out.push({base:{id,name:pretty(r.name),cat:suggest(r),engine:'',guess:true,isNew:true,repo:r.html_url,repoName:r.name},g:r});
 }
 return out.filter(x=>!store.hidden.includes(x.base.id));
}
function build(base,g,useOver){
 const o=useOver?(store.over[base.id]||{}):{};
 const p=Object.assign(defaults(),base,o);
 p.gh=g||null;
 if(!p.engine&&g&&g.language)p.engine=g.language;
 if(!p.status)p.status=g&&g.pushed_at&&(Date.now()-new Date(g.pushed_at))/864e5>30?'Paused':'Active';
 if(p.confirmed)p.guess=false;
 return p;
}
function allProjects(){
 const list=bases().map(({base,g})=>build(base,g,true));
 for(const c of store.custom)list.push(Object.assign(defaults(),c,{custom:true,gh:null,status:c.status||'Active'}));
 return list;
}
const liveUrl=p=>safeUrl(p.live)||(p.gh&&safeUrl(p.gh.homepage))||(p.gh&&p.gh.has_pages&&!p.custom?`https://${OWNER.toLowerCase()}.github.io/${p.repoName}/`:'');
const needsReview=p=>!p.custom&&p.guess;
function applicable(p){return p.qa.filter(q=>{const t=QA_KIND_TARGET[q.kind];return !t||p.targets.includes(t)})}
/* Release gate: version set, no open bugs, every applicable QA item Passed or Not applicable. */
const ready=p=>!lines(p.bugs).length&&!!p.version.trim()&&applicable(p).every(q=>q.status==='Passed'||q.status==='Not applicable');

/* ---------- UI state ---------- */
const ui={view:'overview',q:'',filter:'all'};
let edit=null,editOrig='',editTab='Details',lastFocus=null,toastT=null;
function parseHash(){
 const h=location.hash.replace(/^#\/?/,'');
 if(!h)ui.view='overview';
 else if(h==='activity')ui.view='activity';
 else if(/^c\/[\w-]+$/.test(h))ui.view='c:'+h.slice(2);
 else if(/^s\/.+$/.test(h))ui.view='s:'+decodeURIComponent(h.slice(2));
 else ui.view='overview';
}
const go=v=>{location.hash=v==='overview'?'#/':v==='activity'?'#/activity':v.startsWith('c:')?'#/c/'+v.slice(2):'#/s/'+encodeURIComponent(v.slice(2))};
function viewTitle(){
 if(ui.view==='overview')return 'Your games. Moving forward.';
 if(ui.view==='activity')return 'Recent activity';
 if(ui.view.startsWith('c:'))return catName(ui.view.slice(2));
 return ui.view.slice(2);
}
function visible(list){
 const q=ui.q.trim().toLowerCase();
 return list.filter(p=>{
  if(ui.view.startsWith('c:')&&p.cat!==ui.view.slice(2))return false;
  if(ui.view.startsWith('s:')&&p.status!==ui.view.slice(2))return false;
  if(ui.view==='overview'&&ui.filter!=='all'){
   if(ui.filter==='review'){if(!needsReview(p))return false}
   else if(p.status!==ui.filter)return false;
  }
  if(!q)return true;
  return [p.name,p.engine,catName(p.cat),p.repoName,p.gh&&p.gh.description,p.blocker,...p.targets].join(' ').toLowerCase().includes(q);
 });
}

function activityHtml(all,list){

 for(const p of list){
  for(const l of p.logs)rows.push({title:l.title,sub:`${p.name} · ${l.type} · ${l.date}`,date:l.date,url:l.url});

 rows.sort((a,b)=>b.date.localeCompare(a.date));

function openEditor(p){
 lastFocus=document.activeElement;
 edit=clone(Object.assign({},p,{gh:null}));edit.gh=p.gh;
 editOrig=JSON.stringify(strip(edit));editTab='Details';
 renderEditor();
 const d=$('#editor .editor');if(d)d.focus();
}
const strip=p=>{const o={};for(const k of FIELDS.concat(['id']))o[k]=p[k];return o};
const dirty=()=>edit&&JSON.stringify(strip(edit))!==editOrig;
function closeEditor(force){
 if(!edit)return;

function linkField(k,label,ph){const v=edit[k]||'';return `<label>${esc(label)}<div class="linkinput"><input type="url" data-f="${k}" placeholder="${esc(ph||'https://…')}" value="${esc(v)}">${safeUrl(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(label)}">${ic('ext',17)}</a>`:''}</div></label>`}

  <div class="formgrid"><label>Project name<input required data-f="name" value="${esc(e.name)}" placeholder="Your next great game"></label>

  <label>Platform targets<div class="targetchoices">${TARGETS.map(t=>`<button type="button" data-tg="${t}" class="${e.targets.includes(t)?'on':''}" aria-pressed="${e.targets.includes(t)}">${e.targets.includes(t)?ic('check',14)+' ':''}${t}</button>`).join('')}</div></label>

 }
 if(editTab==='Features & bugs'){
  return `<p class="help">One item per line. Move completed work into Completed features as you go.</p>`+[['bugs','Open bugs','Describe the issue and steps to reproduce'],['pending','Pending features','What still needs to be built?'],['done','Completed features','What is already working?']].map(([k,l,ph])=>`<label>${l} <span class="badge" id="cnt-${k}">${lines(e[k]).length}</span><textarea rows="6" data-f="${k}" data-count="${k}" placeholder="${ph}">${esc(e[k])}</textarea></label>`).join('');
 }
 if(editTab==='QA checklist'){
  const last=[...e.qa].filter(q=>q.date&&q.device&&q.status!=='Not tested').sort((a,b)=>b.date.localeCompare(a.date))[0];
  return `<div class="warning">Only select Passed for Real iPhone or Real Steam Deck after testing on that physical device. Browser emulation and automated tests do not count.</div>`+e.qa.map((q,i)=>`<div class="qacard"><span class="badge ${q.kind.startsWith('Real')?'green':'blue'}">${esc(q.kind)}</span><h3>${esc(q.label)}</h3><div class="formgrid">
   <label>Result<select data-qa="${i}:status">${['Not tested','Passed','Failed','Blocked','Not applicable'].map(v=>`<option ${q.status===v?'selected':''}>${v}</option>`).join('')}</select></label>

 }
 /* Changelog */
 return `<p class="help">Record commits, pull requests and releases by hand. GitHub pushes also show up automatically under Recent activity.</p>
 <div class="qacard"><label>Entry title<input id="lg-title" placeholder="Fixed mobile save persistence"></label>

 <label>Commit / PR / release URL<input type="url" id="lg-url" placeholder="https://github.com/…"></label>
 <button type="button" class="secondary" data-act="addlog">${ic('plus',16)}Add entry to project</button></div>`+
 e.logs.map((l,i)=>`<div class="historyrow">${ic('git',20)}<div><strong>${esc(l.title)}</strong><small>${esc(l.type)} · ${esc(l.date)}</small></div>${safeUrl(l.url)?`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open changelog link">${ic('up',18)}</a>`:''}<button type="button" class="iconbtn" aria-label="Remove changelog entry" data-rmlog="${i}">${ic('x',16)}</button></div>`).join('');

function renderEditor(){
 const e=edit;if(!e)return;
 $('#editor').innerHTML=`<div class="overlay" data-overlay><section class="editor" role="dialog" aria-modal="true" aria-label="Project editor" tabindex="-1">
 <div class="edithead"><div><small>PROJECT WORKSPACE · ${esc(catName(e.cat).toUpperCase())}</small><h2>${esc(e.name||'New project')}</h2></div><button class="iconbtn" aria-label="Close editor" data-act="closeedit">${ic('x',20)}</button></div>
 <div class="edittabs" role="tablist">${['Details','Features & bugs','QA checklist','Changelog'].map(t=>`<button type="button" role="tab" aria-selected="${editTab===t}" data-tab="${esc(t)}" class="${editTab===t?'on':''}">${t}</button>`).join('')}</div>
 <form id="editform"><div class="editbody" id="editbody">${editorBody()}</div>
 <div class="editfoot">${e.custom?`<button type="button" class="danger iconbtn" aria-label="Delete project" data-act="delete">${ic('trash',18)}</button>`:`<button type="button" class="danger iconbtn txt" data-act="hide" title="Remove from this board (restorable)">${ic('trash',16)}Hide</button>`}
 <small>Changes save when you tap Save project.</small><button type="submit" class="primary" id="savebtn" ${e.name.trim()?'':'disabled'}>Save project${ic('check',17)}</button></div></form></section></div>`;
 const d=$('#editor .editor');if(d&&!d.contains(document.activeElement))d.focus();

function saveEdit(){
 const p=edit;if(!p.name.trim())return;
 p.confirmed=true;
 if(p.custom){
  const rec=strip(p);rec.custom=true;
  const i=store.custom.findIndex(c=>c.id===p.id);
  if(i>=0)store.custom[i]=rec;else store.custom.unshift(rec);
 }else{
  const src=bases().find(x=>x.base.id===p.id);
  const ref=src?build(src.base,src.g,false):defaults();
  const d={};for(const k of FIELDS)if(!same(p[k],ref[k]))d[k]=p[k];
  store.over[p.id]=d;
 }
 if(persist()){closeEditor(true);render();toast('Project saved')}
}

/* ---------- toast / backup ---------- */
function toast(msg,err){
 const r=$('#toast-root');r.innerHTML=`<div class="toast" role="status">${ic(err?'alert':'check',17)}${esc(msg)}</div>`;
 clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML=''},err?7000:3500);
}
function doExport(){
 const blob=new Blob([JSON.stringify({app:'gameboard',version:2,exported:new Date().toISOString(),...store},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gameboard-backup-${today()}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 toast('Backup downloaded');
}
function doImport(file){
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||d.app!=='gameboard'||typeof d.over!=='object'||!Array.isArray(d.custom)||!Array.isArray(d.hidden))throw 0;
   if(!confirm('Replace the edits saved in this browser with the contents of this backup?'))return;
   store={over:d.over,custom:d.custom,hidden:d.hidden};
   if(persist()){render();toast('Backup restored')}
  }catch(e){toast('That file is not a Gameboard backup.',true)}
 };
 fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-open],[data-act],[data-filter],[data-filter-go],[data-tab],[data-tg],[data-rmlog]');
 if(!t){ if(edit&&e.target.matches('[data-overlay]'))closeEditor(); return; }
 if(t.dataset.go!==undefined){if(t.dataset.reset)ui.filter='all';go(t.dataset.go);return}
 if(t.dataset.filterGo!==undefined){ui.filter=t.dataset.filterGo;ui.q='';if(ui.view==='overview')render();else go('overview');return}
 if(t.dataset.filter!==undefined){ui.filter=t.dataset.filter;render();return}
 if(t.dataset.open){const p=allProjects().find(x=>x.id===t.dataset.open);if(p)openEditor(p);return}
 if(t.dataset.tab){editTab=t.dataset.tab;renderEditor();return}
 if(t.dataset.tg){const k=t.dataset.tg;edit.targets=edit.targets.includes(k)?edit.targets.filter(x=>x!==k):[...edit.targets,k];renderEditor();return}
 if(t.dataset.rmlog!==undefined){edit.logs.splice(+t.dataset.rmlog,1);renderEditor();return}
 switch(t.dataset.act){
  case 'add':{const p=Object.assign(defaults(),{id:uid(),custom:true,name:'',cat:ui.view.startsWith('c:')?ui.view.slice(2):'lab',engine:'Browser',status:'Active',gh:null});openEditor(p);break}
  case 'refresh':fetchGh(true);break;
  case 'theme':toggleTheme();break;
  case 'export':doExport();break;
  case 'import':$('#importfile').click();break;
  case 'unhide':store.hidden=[];if(persist()){render();toast('Hidden projects restored')}break;
  case 'closeedit':closeEditor();break;
  case 'addlog':{const title=$('#lg-title').value.trim(),date=$('#lg-date').value;if(!title||!date)return;
    edit.logs.unshift({title,type:$('#lg-type').value,url:$('#lg-url').value.trim(),date});renderEditor();break}
  case 'delete':if(confirm('Permanently delete this project and its tracking notes?')){store.custom=store.custom.filter(c=>c.id!==edit.id);if(persist()){closeEditor(true);render();toast('Project deleted')}}break;
  case 'hide':if(confirm('Hide this project from the board? Your GitHub repo is untouched, and you can restore it from the sidebar.')){const id=edit.id;store.hidden.push(id);delete store.over[id];if(persist()){closeEditor(true);render();toast('Project hidden')}}break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){ui.q=t.value;renderGridOnly();return}
 if(!edit)return;
 if(t.dataset.f){edit[t.dataset.f]=t.value;
  if(t.dataset.f==='name'){const b=$('#savebtn');if(b)b.disabled=!t.value.trim();const h=$('#editor h2');if(h)h.textContent=t.value||'New project'}
  if(t.dataset.count){const c=$('#cnt-'+t.dataset.count);if(c)c.textContent=lines(t.value).length}
  if(t.dataset.f==='repo'||t.dataset.f==='live'||t.dataset.f==='itch'||t.dataset.f==='build'){/* open-link icon refreshes on next tab render */}
  return}
 if(t.dataset.pr!==undefined){edit.priorities[+t.dataset.pr]=t.value;return}
 if(t.dataset.qa){const[i,k]=t.dataset.qa.split(':');edit.qa[+i][k]=t.value}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='importfile'){if(t.files[0])doImport(t.files[0]);t.value='';return}
 if(!edit)return;
 if(t.dataset.f==='status'||t.dataset.f==='cat'){edit[t.dataset.f]=t.value;renderEditor();return}
 if(t.dataset.f&&t.dataset.f!=='name'){edit[t.dataset.f]=t.value}
 if(t.dataset.qa){const[i,k]=t.dataset.qa.split(':');edit.qa[+i][k]=t.value}
});
document.addEventListener('submit',e=>{if(e.target.id==='editform'){e.preventDefault();saveEdit()}});
document.addEventListener('keydown',e=>{
 if(!edit)return;
 if(e.key==='Escape'){e.preventDefault();closeEditor();return}
 if(e.key==='Tab'){
  const d=$('#editor .editor');if(!d)return;
  const f=[...d.querySelectorAll('button,a[href],input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===d)){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
window.addEventListener('hashchange',()=>{if(edit&&!dirty())closeEditor(true);parseHash();render();window.scrollTo(0,0)});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});

/* ---------- boot ---------- */
parseHash();loadGhCache();render();fetchGh(false);
})();

</script>
</body>
