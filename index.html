<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.getItem("gameboard.theme");if(!t&&matchMedia("(prefers-color-scheme:dark)").matches)t="dark";if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="theme-color" content="#f7f8f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@600;700&display=swap">
<title>Gameboard · OuterHeavenX project board</title>
<meta name="description" content="Every OuterHeavenX game and app, sorted by category, with live GitHub status.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gameboard">
<style>

/* Gameboard styles. Rules and tokens: DESIGN.md. Sizes: 10/11/12/14/19/34. Spacing: multiples of 4. Radius: 6, 8, 999. */
:root{
 --bg:#f7f8f5;--surface:#fff;--border:#e0e6da;--border-h:#b9c6b0;
 --text:#24352e;--text2:#4b5b52;--muted:#667060;
 --primary:#264c3b;--primary-h:#1d3d2f;--on-primary:#fff;--hl:#e6ecdd;--focus:#3d7358;--link:#2f6b4c;
 --blue-bg:#e3edf2;--blue-fg:#33596f;--amber-bg:#fbf0d9;--amber-fg:#7a5518;--amber-bd:#ecd29a;--green-bg:#e0eed5;--green-fg:#2c5a26;--grey-bg:#eceee9;--grey-fg:#5d6757;
 --danger:#a8402c;--shadow:0 4px 16px rgba(20,35,25,.08);--scrim:rgba(10,18,13,.5);--toast:#264c3b;
 color-scheme:light}
html[data-theme=dark]{
 --bg:#121714;--surface:#19211c;--border:#2a362e;--border-h:#46604f;
 --text:#dfe8e0;--text2:#b5c4b8;--muted:#8fa092;
 --primary:#3d7358;--primary-h:#4a8566;--hl:#243a2e;--focus:#8fc49f;--link:#9cc48a;
 --blue-bg:#1f3340;--blue-fg:#9cc2d9;--amber-bg:#3d3220;--amber-fg:#e6c27a;--amber-bd:#5c4a28;--green-bg:#26391f;--green-fg:#a6cf7e;--grey-bg:#272e29;--grey-fg:#97a393;
 --danger:#e08f78;--shadow:none;--scrim:rgba(5,10,7,.7);--toast:#2f5a45;
 color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 12px/1.6 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.5}
a{color:var(--link)}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;margin:0;color:var(--text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hv{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex-shrink:0}
code{background:var(--hl);border-radius:6px;padding:0 4px;font-size:11px}

/* layout */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font:700 14px Manrope,sans-serif;color:var(--text);text-decoration:none;padding:4px 8px 8px}
.brand svg{width:24px;height:24px;border-radius:6px}
.navlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 8px 4px}
.navlabel.sp{margin-top:16px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;color:var(--text2);white-space:nowrap}
nav button:hover{background:var(--hl)}
nav button.selected{background:var(--hl);color:var(--text);font-weight:600}
nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.sidebottom{margin-top:auto;border-top:1px solid var(--border);padding-top:16px;color:var(--muted);font-size:11px}
.sidebottom strong{display:block;color:var(--text);font-size:12px;margin-bottom:4px}
.sidebottom p{margin:0 0 12px}
.sidebottom .ghlink{display:flex;align-items:center;gap:8px;color:var(--text2);text-decoration:none;font-size:12px;margin-bottom:16px;height:32px;padding:0 8px;border-radius:6px}
.sidebottom .ghlink:hover{background:var(--hl)}
.bk{display:flex;gap:8px;margin-bottom:12px}
.bk button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text2)}
.bk button:hover{background:var(--hl)}
.linkish{text-decoration:underline;color:inherit;font-size:inherit;padding:4px}
main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 32px;background:var(--bg);border-bottom:1px solid var(--border)}
.crumbs{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;min-width:0}
.crumbs strong{color:var(--text);font-weight:600}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);width:240px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:12px;color:var(--text)}
.search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:6px;color:var(--muted);flex-shrink:0}
.iconbtn:hover{background:var(--hl);color:var(--text)}
.primary{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:6px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:12px;white-space:nowrap}
.primary:hover:not(:disabled){background:var(--primary-h)}
.secondary{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:6px;background:var(--hl);color:var(--text);font-weight:500;font-size:12px}
.secondary:hover{border-color:var(--border-h)}
.page{max-width:1200px;margin:0 auto;padding:32px}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.subtitle{margin:8px 0 0;font-size:14px;color:var(--muted)}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:32px 0 24px}
.stats>button{display:grid;gap:4px;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);text-align:left;transition:border-color .2s ease-out}
.stats>button:hover{border-color:var(--border-h)}
.stats span{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.stats strong{font:700 19px Manrope,sans-serif;display:flex;align-items:center;gap:8px}
.stats small{color:var(--muted);font-size:11px}
.amberdot{width:8px;height:8px;border-radius:999px;background:var(--amber-fg);display:inline-block}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{height:32px;padding:0 12px;border-radius:6px;color:var(--text2)}
.filters button:hover{background:var(--hl)}
.filters .on{background:var(--hl);color:var(--text);font-weight:600}
.resultline{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:16px 0 0;font-size:11px;color:var(--muted)}
.ghnote.warn{color:var(--amber-fg)}
.secthead{display:flex;align-items:baseline;gap:8px;margin:40px 0 4px}
.secthead h2{font-size:19px;font-weight:700}
.secthead .n{color:var(--muted);font-size:12px}
.secthead a{margin-left:auto;font-size:12px;text-decoration:none}
.secthead a:hover{text-decoration:underline}
.blurb{margin:0 0 16px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.blurb+.grid{margin-top:0}

/* card */
.card{content-visibility:auto;contain-intrinsic-size:auto 440px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .2s ease-out,box-shadow .2s ease-out}
.card:hover{border-color:var(--border-h);box-shadow:var(--shadow)}
.thumb{display:block;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--hl);border-bottom:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:11px;background:repeating-linear-gradient(135deg,var(--hl) 0 12px,var(--bg) 12px 24px)}
.shotcount{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:6px;background:rgba(10,18,13,.78);color:#fff;font-size:10px}
.cardmain{display:block;width:100%;padding:16px 16px 8px}
.card h3{font-size:14px;font-weight:700;line-height:1.3;margin:0 0 4px}
.meta{font-size:11px;color:var(--muted)}
.desc{margin:8px 0 0;color:var(--text2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.next{margin:8px 0 0;color:var(--text2);overflow-wrap:anywhere}
.next b{color:var(--muted);font-weight:600;margin-right:4px}
.cardlinks{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;min-height:44px;align-items:flex-start}
.cardlinks a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;color:var(--text2);text-decoration:none;font-size:11px}
.cardlinks a:hover{background:var(--hl)}
.cardfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--hl);color:var(--text2);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge.blue{background:var(--blue-bg);color:var(--blue-fg)}
.badge.amber,.badge.review{background:var(--amber-bg);color:var(--amber-fg)}
.badge.green{background:var(--green-bg);color:var(--green-fg)}
.badge.paused{background:var(--grey-bg);color:var(--grey-fg)}
.badge.new{background:var(--blue-bg);color:var(--blue-fg)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty h3{font-size:14px;margin:8px 0 4px}
.empty p{margin:0}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:48px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:11px}

/* editor panel */
.overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;justify-content:flex-end}
.editor{width:min(560px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;border-left:1px solid var(--border);animation:slide .2s ease-out;outline:0}
@keyframes slide{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.edithead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:16px 16px 16px 24px}
.edithead small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.edithead h2{font-size:19px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.edittabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.edittabs button{height:40px;padding:0 12px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.edittabs button:hover{color:var(--text)}
.edittabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--primary)}
#editform{display:flex;flex-direction:column;flex:1;min-height:0}
.editbody{flex:1;overflow-y:auto;padding:24px}
.editbody label{display:block;margin:0 0 16px;font-weight:600;color:var(--text2)}
.editbody input,.editbody select,.editbody textarea{display:block;width:100%;margin-top:4px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-weight:400}
.editbody textarea{height:auto;min-height:96px;padding:8px 12px;resize:vertical}
.editbody input:focus,.editbody select:focus,.editbody textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.formsection{font-size:14px;margin:24px 0 12px}
.help{margin:0 0 16px;color:var(--muted)}
.targetchoices{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.targetchoices button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-weight:500}
.targetchoices button.on{background:var(--hl);border-color:var(--primary);color:var(--text)}
.linkinput{display:flex;gap:8px;align-items:center}
.linkinput input{flex:1}
.linkinput a{display:inline-grid;place-items:center;width:36px;height:36px;margin-top:4px;border-radius:6px;color:var(--muted)}
.linkinput a:hover{background:var(--hl)}
.priorityinput{display:flex!important;align-items:center;gap:12px}
.priorityinput b{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--hl);font-size:11px;flex-shrink:0}
.priorityinput input{margin-top:0!important;flex:1}
.qacard{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.qacard h3{font-size:14px;margin:8px 0 12px}
.warning{padding:12px 16px;margin:0 0 16px;border:1px solid var(--amber-bd);border-radius:8px;background:var(--amber-bg);color:var(--amber-fg)}
.ghinfo{padding:12px 16px;margin:0 0 16px;border-radius:8px;background:var(--hl);color:var(--text2);font-size:11px}
.ghinfo b{color:var(--text)}
.editfoot{display:flex;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--border);background:var(--surface)}
.editfoot small{flex:1;color:var(--muted);font-size:11px}
.danger{color:var(--danger)}
.danger.txt{display:inline-flex;align-items:center;width:auto;padding:0 12px;gap:6px;font-size:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.history{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 16px}
.historyrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.historyrow:last-child{border-bottom:0}
.historyrow>div{flex:1;min-width:0}
.historyrow strong{display:block;color:var(--text);font-size:12px;overflow-wrap:anywhere}
.historyrow small{display:block;font-size:11px}
.historyrow a{color:var(--muted);display:grid;place-items:center;width:36px;height:36px;border-radius:6px}
.historyrow a:hover{background:var(--hl)}
.editbody .historyrow{padding:12px 0}

/* screenshots */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{border:1px solid var(--border);border-radius:8px;padding:8px}
.slot .pic{aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--hl);display:grid;place-items:center;color:var(--muted)}
.slot .pic button{display:block;width:100%;height:100%}
.slot .pic img{width:100%;height:100%;object-fit:cover;display:block}
.slot .pic span{display:grid;gap:4px;justify-items:center}
.slotbar{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:8px 0}
.slotbar b{font-weight:600}
.slotbar em{font-style:normal;font-size:10px;color:var(--muted)}
.slotbtn{position:relative;overflow:hidden;height:32px;padding:0 12px;white-space:nowrap;cursor:pointer;font-size:11px}
.editbody .slotbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;min-height:0;padding:0;border:0;cursor:pointer}
.lb{position:fixed;inset:0;z-index:40;background:rgba(5,10,7,.94);display:flex;align-items:center;justify-content:center;padding:16px}
.lbin{width:min(1200px,100%);display:flex;flex-direction:column;gap:12px;color:#e8f0e4}
.lbtop{display:flex;align-items:center;gap:12px}
.lbtop strong{font:700 14px Manrope,sans-serif}
.lbtop span{font-size:12px;color:#a9b9ad}
.lbtop .iconbtn{margin-left:auto;color:#fff}
.lbpic{display:flex;align-items:center;gap:8px}
.lbpic img{flex:1;min-width:0;max-height:72vh;object-fit:contain;border-radius:8px;background:#0b130e}
.lbnav{color:#fff}
.lbnav:hover{background:rgba(255,255,255,.12);color:#fff}
.lbdots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lbdots button{height:32px;padding:0 12px;border:1px solid #2a362e;border-radius:6px;color:#a9b9ad;font-size:11px}
.lbdots .on{background:#2f5a45;border-color:#2f5a45;color:#fff}

#toast-root{position:fixed;left:0;right:0;bottom:24px;display:flex;justify-content:center;z-index:50;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:8px;background:var(--toast);color:#fff;font-size:12px;max-width:min(560px,calc(100% - 32px))}

@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
 #app{display:block}
 aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:12px 16px 8px;gap:0}
 .navs{display:flex;overflow-x:auto;gap:4px;margin:0 -8px;padding-bottom:4px}
 .navs .navlabel{display:none}
 .navs nav{display:contents}
 .sidebottom{display:none}
 .topbar{padding:12px 16px;position:static}
 .crumbs{display:none}
 .tools{margin-left:0;width:100%}
 .search{flex:1 1 0;width:auto;min-width:0}
 .tools{flex-wrap:nowrap}
 .primary{padding:0 12px}
 .page{padding:24px 16px}
 h1{font-size:19px}
 .stats{margin:24px 0 16px}
 .formgrid{grid-template-columns:1fr}
 .slots{grid-template-columns:1fr}
 .lbnav{display:none}
 .editfoot{padding:16px}
 .editbody{padding:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


</style>
</head>
<body>
<div id="app"></div>
<div id="editor"></div>
<div id="lightbox"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript><p style="padding:2rem">Gameboard needs JavaScript to run.</p></noscript>
<script>
(()=>{
'use strict';
/* ====================================================================
   Gameboard — static project board for github.com/OuterHeavenX
   - No backend, no build step. Runs on GitHub Pages or from a local file.
   - Repo list + status come live from the public GitHub API (cached 1 hour).
   - Your edits (status, bugs, QA, notes...) are saved in this browser's
     localStorage. Use Backup > Export / Import to move them between devices.
   ==================================================================== */
const OWNER='OuterHeavenX';
const KEY='gameboard.v2', GHKEY='gameboard.gh.v1';
const GH_TTL=60*60*1000;

/* ---------- Categories ---------- */
const CATS=[
 {id:'builders',name:'Builders & Kingdoms',blurb:'Towns, villages, kingdoms and management sims.'},
 {id:'cozy',name:'Cozy & Life Sims',blurb:'Relaxed life, farming and crafting games.'},
 {id:'defense',name:'Defense & Strategy',blurb:'Tower defense, RTS and siege games.'},
 {id:'rpg',name:'RPGs & Tactics',blurb:'JRPGs, tactics / SRPGs and dungeon climbers.'},
 {id:'action',name:'Action & Metroidvania',blurb:'Brawlers, platformers, stealth and shooters.'},
 {id:'horror',name:'Horror & Survival',blurb:'Dread, scarcity and last stands.'},
 {id:'tools',name:'Apps & Tools',blurb:'Things you use rather than play.'},
 {id:'lab',name:'Prototypes & Experiments',blurb:'Tests, spikes and ideas not yet sorted into a genre.'}
];
const catName=id=>(CATS.find(c=>c.id===id)||{name:'Unsorted'}).name;

/* ---------- Seed manifest: [repo, display name, category, engine, guessed?] ----------
   "guessed" = category inferred from the repo name only. Open the project and Save
   (or change the category) to confirm it. */
const M=[
 ['Meadowline','Meadowline','builders','Browser'],
 ['The-Village','The Village','builders','Browser'],
 ['The-Settlement-','The Settlement','builders','Browser',1],
 ['kingdom-of-nobodies','Kingdom of Nobodies','builders','Browser / three.js'],
 ['greyhaven-town','Greyhaven Town','builders','Browser',1],
 ['citadel-of-vesper','Citadel of Vesper','builders','Browser',1],
 ['mech-junkyard-','Mech Junkyard','builders','Browser',1],
 ['Idle-Guild-Master','Idle Guild Master','builders','Browser'],
 ['settlers-remake','Settlers Remake (fork)','builders','',1],

 ['tiny-living-world','Tiny Living World','cozy','Browser / three.js'],
 ['chill-town','Chill Town','cozy','Browser'],
 ['Alchemy-Island','Alchemy Island','cozy','Browser',1],
 ['Codex-Farm-Challenge','Codex Farm Challenge','cozy','Browser'],
 ['rockstar-life','Rockstar Life','cozy','Browser',1],

 ['hoard-defense','Hoard Defense','defense','Browser'],

/* ---------- screenshots ----------
   Two sources, local upload wins:
   1) shots/<repo>/{title,play1,play2}.jpg in this repo (auto-captured by the GitHub Action, or committed by hand)
   2) uploads made in the Screenshots tab, kept in this browser (IndexedDB) */
const SLOTS=[['title','Title screen'],['play1','Gameplay 1'],['play2','Gameplay 2']];
let shotsIdx={},localShots={};
const idb={db:null,
 open(){return this.db||(this.db=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('gameboard-shots',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async all(){const db=await this.open();return new Promise((res,rej)=>{const out={},q=db.transaction('s').objectStore('s').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};q.onerror=()=>rej(q.error)})},
 async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 async del(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('s','readwrite');t.objectStore('s').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
async function loadShots(){
 try{if(location.protocol==='file:')throw 0;const r=await fetch('shots/index.json',{cache:'no-cache'});if(r.ok){const d=await r.json();shotsIdx={};for(const[k,v]of Object.entries(d.repos||{}))shotsIdx[k.toLowerCase()]={shots:v.shots||[],thumb:!!v.thumb,v:v.captured||''}}}catch(e){}
 try{const all=await idb.all();for(const[k,blob]of Object.entries(all))localShots[k]=URL.createObjectURL(blob)}catch(e){}
 invalidate();render();
}
function shotsFor(p){
 const out=[],ix=!p.custom&&p.repoName?shotsIdx[p.id]:null;
 const base=ix?`shots/${encodeURIComponent(p.repoName)}/`:'',q=ix&&ix.v?'?v='+encodeURIComponent(ix.v):'';
 for(const[slot,label]of SLOTS){
  const loc=localShots[p.id+'|'+slot],repo=ix&&ix.shots.includes(slot);
  if(!loc&&!repo)continue;
  out.push({slot,label,url:loc||base+slot+'.jpg'+q,thumb:!loc&&slot==='title'&&ix.thumb?base+'thumb.jpg'+q:'',local:!!loc});
 }
 return out;
}
async function compress(file){
 const bmp=await createImageBitmap(file);const sc=Math.min(1,1280/bmp.width);
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}
async function setShot(id,slot,file){
 try{
  const blob=await compress(file);const k=id+'|'+slot;
  await idb.put(k,blob);if(localShots[k])URL.revokeObjectURL(localShots[k]);localShots[k]=URL.createObjectURL(blob);
  toast('Screenshot saved in this browser');
 }catch(e){toast('Could not use that image. Try a PNG or JPG.',true)}
 render();if(edit)renderEditor();
}
async function clearShot(id,slot){
 const k=id+'|'+slot;
 try{await idb.del(k)}catch(e){}
 if(localShots[k]){URL.revokeObjectURL(localShots[k]);delete localShots[k]}
 render();if(edit)renderEditor();
}

async function fetchGh(force){
 if(!force&&gh.repos.length&&Date.now()-gh.t<GH_TTL)return;
 gh.loading=true;gh.err='';render();
 try{
  let all=[];
  for(let page=1;page<=5;page++){
   const r=await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=pushed&page=${page}`,{headers:{Accept:'application/vnd.github+json'}});
   if(!r.ok){throw new Error(r.status===403||r.status===429?'GitHub rate limit reached — try again in a bit.':'GitHub returned '+r.status+'.')}
   const batch=await r.json();
   all=all.concat(batch.map(x=>({name:x.name,html_url:x.html_url,description:x.description||'',language:x.language||'',topics:x.topics||[],pushed_at:x.pushed_at,stars:x.stargazers_count,has_pages:!!x.has_pages,homepage:x.homepage||'',archived:!!x.archived,fork:!!x.fork})));
   if(batch.length<100)break;
  }
  gh.repos=all;gh.t=Date.now();
  try{localStorage.setItem(GHKEY,JSON.stringify({t:gh.t,repos:all}))}catch(e){}
 }catch(e){
  gh.err=(e&&e.message&&!/Failed to fetch|NetworkError|Load failed/i.test(e.message))?e.message:'Could not reach GitHub.';
  if(gh.repos.length)gh.err+=' Showing the last saved copy'+(gh.t?' ('+ago(new Date(gh.t).toISOString())+')':'')+'.';
 }finally{gh.loading=false;invalidate();render()}
}

function suggest(r){
 const t=(r.name+' '+r.description+' '+(r.topics||[]).join(' ')).toLowerCase();
 const rules=[
  ['tools',/\b(tool|app|dashboard|tracker|vault|manager|pipeline|bible|planner|board)\b/],
  ['defense',/tower|defen[cs]e|\brts\b|siege|strategy|warden|garrison/],
  ['rpg',/\brpg\b|jrpg|tactic|dungeon|quest/],
  ['builders',/city|village|kingdom|town|settle|builder|colony|idle|tycoon|castle/],
  ['cozy',/farm|cozy|life sim|garden|craft|island/],
  ['horror',/horror|surviv|zombie|ghost|dead|haunt|dark/],
  ['action',/platform|metroidvania|brawl|beat|shooter|action|stealth|fight|racing|roguelike/]];
 for(const[id,re]of rules)if(re.test(t))return id;
 return 'lab';
}
function bases(){
 const ghMap=new Map(gh.repos.map(r=>[r.name.toLowerCase(),r]));
 const seen=new Set(),out=[];
 for(const[repo,name,cat,engine,guess]of M){
  const id=repo.toLowerCase();seen.add(id);
  out.push({base:{id,name,cat,engine,guess:!!guess,repo:`https://github.com/${OWNER}/${repo}`,repoName:repo},g:ghMap.get(id)||null});
 }
 for(const r of gh.repos){
  const id=r.name.toLowerCase();if(seen.has(id))continue;
  out.push({base:{id,name:pretty(r.name),cat:suggest(r),engine:'',guess:true,isNew:true,repo:r.html_url,repoName:r.name},g:r});
 }
 return out.filter(x=>!store.hidden.includes(x.base.id));
}
const str=(v,d='')=>typeof v==='string'?v:v==null?d:String(v);
function fix(p){
 for(const k of ['name','engine','version','repo','live','itch','build','bugs','done','pending','blocker','status'])p[k]=str(p[k]);
 if(!CATS.some(c=>c.id===p.cat))p.cat='lab';
 if(p.status&&!STAGES.includes(p.status))p.status='';
 p.targets=Array.isArray(p.targets)?p.targets.filter(t=>TARGETS.includes(t)):['Browser'];
 p.priorities=[0,1,2].map(i=>str(Array.isArray(p.priorities)?p.priorities[i]:''));
 p.qa=qaDefaults().map((d,i)=>{const q=Array.isArray(p.qa)&&p.qa[i]&&typeof p.qa[i]==='object'?p.qa[i]:{};return Object.assign(d,{status:str(q.status,d.status),date:str(q.date),device:str(q.device,d.device),notes:str(q.notes)})});
 p.logs=Array.isArray(p.logs)?p.logs.filter(l=>l&&typeof l==='object').map(l=>({title:str(l.title),type:str(l.type,'Commit'),url:str(l.url),date:str(l.date)})):[];
 p.confirmed=!!p.confirmed;
 return p;
}
function cleanStore(s){
 const over={};if(s&&s.over&&typeof s.over==='object')for(const[k,v]of Object.entries(s.over))if(v&&typeof v==='object'&&!Array.isArray(v))over[k]=v;
 return{over,custom:Array.isArray(s&&s.custom)?s.custom.filter(c=>c&&typeof c==='object'&&typeof c.id==='string'):[],hidden:Array.isArray(s&&s.hidden)?s.hidden.filter(x=>typeof x==='string'):[]};
}
function build(base,g,useOver){
 const o=useOver?(store.over[base.id]||{}):{};
 const p=fix(Object.assign(defaults(),base,o));
 p.gh=g||null;
 if(!p.engine&&g&&g.language)p.engine=g.language;
 if(!p.status)p.status=g&&g.pushed_at&&(Date.now()-new Date(g.pushed_at))/864e5>30?'Paused':'Active';
 if(p.confirmed)p.guess=false;
 return p;
}

 if(_all)return _all;

function toast(msg,err){
 const r=$('#toast-root');r.innerHTML=`<div class="toast" role="status">${ic(err?'alert':'check',17)}${esc(msg)}</div>`;
 clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML=''},err?7000:3500);

function doExport(){
 const blob=new Blob([JSON.stringify({app:'gameboard',version:2,exported:new Date().toISOString(),...store},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gameboard-backup-${today()}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 toast('Backup downloaded');
}
function doImport(file){
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||d.app!=='gameboard'||typeof d.over!=='object'||!Array.isArray(d.custom)||!Array.isArray(d.hidden))throw 0;
   if(!confirm('Replace the edits saved in this browser with the contents of this backup?'))return;
   store=cleanStore(d);
   if(persist()){render();toast('Backup restored')}
  }catch(e){toast('That file is not a Gameboard backup.',true)}
 };
 fr.readAsText(file);
}

 if(t.dataset.gallery){openLightbox(t.dataset.gallery,0);return}
 if(t.dataset.shotsOpen){const p=allProjects().find(x=>x.id===t.dataset.shotsOpen);if(p){openEditor(p);editTab='Screenshots';renderEditor()}return}
 if(t.dataset.lbopen){const sh=shotsFor(edit);openLightbox(edit.id,Math.max(0,sh.findIndex(x=>x.slot===t.dataset.lbopen)));return}

 if(t.dataset.filterGo!==undefined){ui.filter=t.dataset.filterGo;ui.q='';if(ui.view==='overview')render();else go('overview');return}
 if(t.dataset.filter!==undefined){ui.filter=t.dataset.filter;render();return}
 if(t.dataset.open){const p=allProjects().find(x=>x.id===t.dataset.open);if(p)openEditor(p);return}
 if(t.dataset.tab){editTab=t.dataset.tab;renderEditor();return}
 if(t.dataset.tg){const k=t.dataset.tg;edit.targets=edit.targets.includes(k)?edit.targets.filter(x=>x!==k):[...edit.targets,k];renderEditor();return}
 if(t.dataset.rmlog!==undefined){edit.logs.splice(+t.dataset.rmlog,1);renderEditor();return}
 switch(t.dataset.act){
  case 'add':{const p=Object.assign(defaults(),{id:uid(),custom:true,name:'',cat:ui.view.startsWith('c:')?ui.view.slice(2):'lab',engine:'Browser',status:'Active',gh:null});openEditor(p);break}
  case 'refresh':fetchGh(true);break;
  case 'theme':toggleTheme();break;
  case 'export':doExport();break;
  case 'import':$('#importfile').click();break;
  case 'unhide':store.hidden=[];if(persist()){render();toast('Hidden projects restored')}break;
  case 'closeedit':closeEditor();break;
  case 'addlog':{const title=$('#lg-title').value.trim(),date=$('#lg-date').value;if(!title||!date){toast('Add a title and a date first.',true);return}
    edit.logs.unshift({title,type:$('#lg-type').value,url:$('#lg-url').value.trim(),date});renderEditor();break}
  case 'delete':if(confirm('Permanently delete this project and its tracking notes?')){store.custom=store.custom.filter(c=>c.id!==edit.id);if(persist()){closeEditor(true);render();toast('Project deleted')}}break;
  case 'hide':if(confirm('Hide this project from the board? Your GitHub repo is untouched, and you can restore it from the sidebar.')){const id=edit.id;store.hidden.push(id);delete store.over[id];if(persist()){closeEditor(true);render();toast('Project hidden')}}break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){ui.q=t.value;clearTimeout(qT);qT=setTimeout(renderGridOnly,100);return}
 if(!edit)return;
 if(t.dataset.f){edit[t.dataset.f]=t.value;
  if(t.dataset.f==='name'){const b=$('#savebtn');if(b)b.disabled=!t.value.trim();const h=$('#editor h2');if(h)h.textContent=t.value||'New project'}
  if(t.dataset.count){const c=$('#cnt-'+t.dataset.count);if(c)c.textContent=lines(t.value).length}
  if(t.dataset.f==='repo'||t.dataset.f==='live'||t.dataset.f==='itch'||t.dataset.f==='build'){/* open-link icon refreshes on next tab render */}
  return}
 if(t.dataset.pr!==undefined){edit.priorities[+t.dataset.pr]=t.value;return}
 if(t.dataset.qa){const[i,k]=t.dataset.qa.split(':');edit.qa[+i][k]=t.value}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.slotfile&&edit){const f=t.files[0];if(f)setShot(edit.id,t.dataset.slotfile,f);t.value='';return}
 if(t.id==='importfile'){if(t.files[0])doImport(t.files[0]);t.value='';return}
 if(!edit)return;
 if(t.dataset.f==='status'||t.dataset.f==='cat'){edit[t.dataset.f]=t.value;renderEditor();return}
 if(t.dataset.f&&t.dataset.f!=='name'){edit[t.dataset.f]=t.value}
 if(t.dataset.qa){const[i,k]=t.dataset.qa.split(':');edit.qa[+i][k]=t.value}
});
document.addEventListener('submit',e=>{if(e.target.id==='editform'){e.preventDefault();saveEdit()}});
document.addEventListener('keydown',e=>{
 if(lb){
  if(e.key==='Escape'){e.preventDefault();closeLightbox()}
  else if(e.key==='ArrowRight'&&lb.sh.length>1){lb.i=(lb.i+1)%lb.sh.length;renderLightbox()}
  else if(e.key==='ArrowLeft'&&lb.sh.length>1){lb.i=(lb.i-1+lb.sh.length)%lb.sh.length;renderLightbox()}
  return;
 }
 if(!edit)return;
 if(e.key==='Escape'){e.preventDefault();closeEditor();return}
 if(e.key==='Tab'){
  const d=$('#editor .editor');if(!d)return;
  const f=[...d.querySelectorAll('button,a[href],input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===d)){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
window.addEventListener('hashchange',()=>{if(edit&&!dirty())closeEditor(true);parseHash();render();window.scrollTo(0,0)});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});

/* ---------- boot ---------- */
parseHash();loadGhCache();render();fetchGh(false);loadShots();
})();

</script>
</body>
</html>
